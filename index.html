<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atlas de jogos de tabuleiro tradicionais</title>
    <meta
      name="description"
      content="Atlas interativo de jogos de tabuleiro tradicionais do mundo: clique num país e conheça a história e as regras dos jogos registrados."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Atlas de jogos de tabuleiro tradicionais" />
    <meta
      property="og:description"
      content="Clique num país e conheça a história e as regras dos jogos de tabuleiro tradicionais registrados no catálogo."
    />
    <meta property="og:image" content="https://gmsarti.github.io%BASE_URL%og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="%BASE_URL%geo/countries.json" as="fetch" crossorigin />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Atlas de jogos de tabuleiro tradicionais</h1>
        <div class="tools">
          <input type="search" id="search" class="search" placeholder="Buscar jogo, nome local ou família" aria-label="Buscar jogo, nome local ou família" autocomplete="off" />
          <div class="fam" id="fam">
            <button type="button" class="fam-button" id="fam-button" aria-expanded="false" aria-controls="fam-menu">Família: todas</button>
            <ul class="fam-menu" id="fam-menu" aria-label="Filtrar por família" hidden></ul>
          </div>
          <button type="button" class="theme-toggle" id="theme" aria-label="Mudar de tema"></button>
        </div>
      </header>
      <main>
        <div class="mapbox" id="mapbox">
          <svg id="map" role="img" aria-label="Mapa-múndi com países que têm jogos registrados"></svg>
          <div class="zoom">
            <button type="button" id="zin" aria-label="Aproximar">+</button>
            <button type="button" id="zout" aria-label="Afastar">−</button>
            <button type="button" id="zreset" aria-label="Ver mundo inteiro">⟲</button>
          </div>
          <div class="legend">
            <span><i class="sw sw-1"></i>1 jogo</span>
            <span><i class="sw sw-2"></i>2–3</span>
            <span><i class="sw sw-3"></i>4 ou mais</span>
            <span id="legend-game" hidden><i class="sw sw-game"></i>onde se joga</span>
          </div>
          <div class="tip" id="tip"></div>
        </div>
        <aside id="panel" aria-live="polite"></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
